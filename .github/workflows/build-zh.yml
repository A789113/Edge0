# .github/workflows/build-zh.yml
# 绠€浣撲腑鏂囧畾鍒剁増鎵撳寘娴佺▼
#
# 鍦?windows-latest锛堝井杞畼鏂?Windows 鏈哄櫒锛変笂鍘熺敓缂栬瘧鏁翠釜 Edge0锛?#   Edge0 Chat.exe锛圱auri 妗岄潰搴旂敤锛?#   edge0-infer.exe锛堟帹鐞嗗紩鎿庯紝MSVC + Vulkan锛?#   edge0-strata\锛坰trata.exe + Python 杩愯鏃?+ serve 缃戦〉锛?# 浜у嚭 edge0-chat-<version>-windows-x64.zip锛屽竷灞€涓庡畼鏂瑰彂甯冧竴鑷达紝鍏ㄩ儴涓枃鐣岄潰銆?#
# 渚濇嵁锛氬畼鏂规墦鍖呰剼鏈?scripts/package/windows/package.ps1 鐨勪笁涓樁娈?#   fetch锛堣仈缃戞媺渚濊禆锛夆啋 build锛堢绾跨紪璇戞墦鍖咃級鈫?verify锛堣嚜妫€锛?# 鏈?workflow 澶嶇敤璇ヨ剼鏈紝鍙澶栬瀹冮渶瑕佺殑 CUDA Toolkit 鍜?Vulkan SDK銆?#
# 娉ㄦ剰锛氭墍鏈?run: | 鑴氭湰鍧椾竴寰嬬函 ASCII锛堣嫳鏂囷級锛岄伩鍏?Windows PowerShell 5.1
# 鍦ㄨ鍙栧惈涓枃鐨勮剼鏈椂鍑虹幇缂栫爜/瑙ｆ瀽閿欒锛涗腑鏂囧彧鍑虹幇鍦?name: 姝ラ鏍囬銆?
name: 鏋勫缓涓枃鐗?Edge0 Chat

'on':
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 鍘熺敓缂栬瘧鎵撳寘
    # windows-2022 = VS 2022 (MSVC 14.3x), which CUDA 13.0 accepts.
    # windows-latest now resolves to VS 18 / MSVC 14.52, which CUDA 13.0 rejects
    # in crt/host_config.h with "unsupported Microsoft Visual Studio version".
    runs-on: windows-2022
    timeout-minutes: 330

    steps:
      - name: 妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 瀹夎 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 瀹夎 Rust锛圡SVC 鐩爣锛?        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 瀹夎 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 瀹夎 LLVM锛坈lang-cl / lld-link锛?        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The windows-2022 image has no winget but ships LLVM already
          # (llvmArm64 / clang-cl under Visual Studio). Probe first; only
          # fall back to an installer when clang-cl is genuinely absent.
          $found = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          if ($found) {
            Write-Host "clang-cl already present: $($found.Source)"
          } else {
            Write-Host "clang-cl not on PATH; looking under Visual Studio..."
            $candidates = @(
              'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin',
              'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\bin',
              'C:\Program Files\LLVM\bin'
            )
            foreach ($c in $candidates) {
              if (Test-Path (Join-Path $c 'clang-cl.exe')) {
                Write-Host "using $c"
                $c | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Host "downloading LLVM release archive..."
              $zip = "$env:TEMP\llvm.zip"
              $ProgressPreference = 'SilentlyContinue'
              Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe' -OutFile "$env:TEMP\llvm-installer.exe" -UseBasicParsing
              Start-Process -FilePath "$env:TEMP\llvm-installer.exe" -ArgumentList '/S' -Wait -NoNewWindow
              $llvm = 'C:\Program Files\LLVM\bin'
              if (Test-Path $llvm) { $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
            }
          }
          # Report what we ended up with (capture full output first:
          # piping clang --version into Select-Object -First 1 closes the pipe
          # early and throws under ErrorActionPreference='Stop').
          $clang = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          if ($clang) {
            Write-Host "clang-cl ready: $($clang.Source)"
            $ver = & $clang.Source --version 2>&1 | Out-String
            Write-Host ($ver.Trim())
          } else {
            Write-Host "WARNING: clang-cl still not on PATH"
          }

      - name: 瀹夎 Vulkan SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://sdk.lunarg.com/sdk/download/1.4.363.1/windows/vulkansdk-windows-X64-1.4.363.1.exe'
          $installer = "$env:TEMP\vulkan-sdk.exe"
          Write-Host "Downloading Vulkan SDK..."
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait -NoNewWindow
          $sdkRoot = 'C:\VulkanSDK\1.4.363.1'
          if (-not (Test-Path $sdkRoot)) {
            $sdkRoot = (Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          }
          Write-Host "VULKAN_SDK=$sdkRoot"
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkRoot\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 瀹夎 CUDA Toolkit 13
        shell: powershell
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = 'Stop'
          # Use the local (offline) installer instead of the network bootstrapper:
          # the bootstrapper exits with 0xE0E00019 when sub-package download fails,
          # and component names are not documented for this project.
          $url = 'https://developer.download.nvidia.com/compute/cuda/13.0.0/local_installers/cuda_13.0.0_windows.exe'
          $installer = "$env:TEMP\cuda-local.exe"
          Write-Host "Downloading CUDA local installer (~3 GB)..."
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          $sw.Stop()
          $size = (Get-Item $installer).Length
          Write-Host ("Downloaded {0:N1} MB in {1:N0} s" -f ($size/1MB), $sw.Elapsed.TotalSeconds)
          if ($size -lt 2GB) { throw "installer looks truncated: $size bytes" }

          Write-Host "Installing CUDA (silent, all default components)..."
          $p = Start-Process -FilePath $installer -ArgumentList '-s' -Wait -PassThru -NoNewWindow
          Write-Host "CUDA installer exit code: $($p.ExitCode)"

          $cudaBase = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA'
          if (-not (Test-Path $cudaBase)) { throw "CUDA toolkit directory missing after install" }
          $cudaRoot = (Get-ChildItem $cudaBase -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          Write-Host "CUDA root: $cudaRoot"
          $hostConfig = Join-Path $cudaRoot 'include\crt\host_config.h'
          if (-not (Test-Path $hostConfig)) {
            Write-Host "crt/host_config.h missing; include dir contents:"
            Get-ChildItem (Join-Path $cudaRoot 'include') -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { Write-Host ("  " + $_.Name) }
            throw "CUDA dev headers incomplete: crt/host_config.h not found"
          }
          Write-Host "CUDA dev headers OK"
          Write-Host "CUDA_PATH=$cudaRoot"
          "CUDA_PATH=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cudaRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 鍔犺浇 MSVC 寮€鍙戠幆澧?        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 楠岃瘉 nvcc 鑳介厤鍚?MSVC 宸ヤ綔
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          # Diagnose the CMake CUDA detection failure in isolation, so the real
          # nvcc error is visible instead of CMake's bare "1".
          Write-Host "=== nvcc version ==="
          & nvcc --version 2>&1 | Out-String | ForEach-Object { Write-Host $_ }
          Write-Host "=== cl version ==="
          & cl 2>&1 | Out-String | Select-Object -First 3 | ForEach-Object { Write-Host $_ }
          Write-Host "=== host compiler env ==="
          Write-Host "CUDAHOSTCXX=$env:CUDAHOSTCXX"
          Write-Host "CMAKE_CUDA_COMPILER=$env:CMAKE_CUDA_COMPILER"

          # Compile a trivial CUDA translation unit.
          $dir = "$env:RUNNER_TEMP\nvccprobe"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content -Path "$dir\t.cu" -Value "int main(){return 0;}" -Encoding ascii
          Push-Location $dir
          try {
            Write-Host "=== compiling trivial .cu with nvcc ==="
            $out = & nvcc -ccbin cl -arch=sm_75 -c t.cu -o t.obj 2>&1 | Out-String
            Write-Host $out
            Write-Host "nvcc exit: $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "=== retry without -ccbin (let nvcc find cl) ==="
              $out2 = & nvcc -arch=sm_75 -c t.cu -o t.obj 2>&1 | Out-String
              Write-Host $out2
              Write-Host "nvcc exit(2): $LASTEXITCODE"
            }
          } finally { Pop-Location }
          # Non-fatal: this step only reports. package.ps1 does the real build.
          Write-Host "=== nvcc probe done ==="

      - name: 鏋勫缓鍓嶆鏌ュ伐鍏烽摼
        shell: powershell
        run: |
          $tools = @{
            'cl.exe'        = 'MSVC C++ compiler'
            'clang-cl.exe'  = 'LLVM compiler'
            'lld-link.exe'  = 'LLVM linker'
            'nvcc.exe'      = 'CUDA compiler'
            'glslc.exe'     = 'Vulkan shader compiler'
            'cmake.exe'     = 'CMake'
            'ninja.exe'     = 'Ninja'
            'node.exe'      = 'Node.js'
            'npm.cmd'       = 'npm'
            'cargo.exe'     = 'Rust Cargo'
            'python.exe'    = 'Python'
            'curl.exe'      = 'curl'
            'tar.exe'       = 'tar'
            'git.exe'       = 'Git'
            'link.exe'      = 'MSVC linker'
          }
          $missing = @()
          foreach ($t in ($tools.Keys | Sort-Object)) {
            $found = Get-Command $t -ErrorAction SilentlyContinue
            if ($found) {
              Write-Host ("  OK   {0,-14} {1}" -f $t, $found.Source)
            } else {
              Write-Host ("  MISS {0,-14} {1}" -f $t, $tools[$t])
              $missing += $t
            }
          }
          Write-Host ""
          foreach ($v in @('INCLUDE','LIB','VCToolsRedistDir','CUDA_PATH','VULKAN_SDK')) {
            $val = [Environment]::GetEnvironmentVariable($v)
            if ($val) {
              Write-Host ("  OK   {0,-18} {1}" -f $v, $val)
            } else {
              Write-Host ("  MISS {0,-18} not set" -f $v)
              $missing += "env:$v"
            }
          }
          Write-Host ""
          if ($missing.Count -gt 0) {
            Write-Host ("WARNING: {0} item(s) not ready; package.ps1 check-machine decides" -f $missing.Count)
            Write-Host ("Missing: {0}" -f ($missing -join ', '))
          } else {
            Write-Host "All tools present."
          }

      - name: 缁熶竴 CUDA 瀹夸富缂栬瘧鍣ㄨ矾寰勶紙8.3 鐭悕锛?        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # NVIDIA rule (developer forums): the cl.exe named by -ccbin and the
          # first cl.exe on PATH must be THE SAME STRING, otherwise nvcc answers
          #   "nvcc fatal : Host compiler targets unsupported OS"
          # CMake converts a spaced path to its 8.3 short form for -ccbin, while
          # PATH (set by vcvars) keeps the long form, so the two never match.
          # Fix: compute the 8.3 short form once, then make BOTH sides use it.
          $clLong = (Get-Command cl).Source
          Write-Host "cl (long) : $clLong"
          $binLong = Split-Path $clLong -Parent
          $shortBin = cmd /c "for %I in (`"$binLong`") do @echo %~sI"
          $shortBin = $shortBin.Trim()
          Write-Host "cl bin (8.3): $shortBin"
          if (-not $shortBin -or -not (Test-Path "$shortBin\cl.exe")) {
            throw "cannot resolve 8.3 name for $binLong (got '$shortBin')"
          }

          # Make sure the short directory is what PATH resolves cl.exe from:
          # drop every long MSVC bin entry, then prepend the short form.
          $parts = $env:PATH -split ';' | Where-Object { $_ -and ($_.TrimEnd('\') -ne $binLong.TrimEnd('\')) }
          $env:PATH = $shortBin + ';' + ($parts -join ';')
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $shortBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Forward-slash form for CMake (backslashes would be eaten).
          $clForCMake = ($shortBin.Replace([char]92, [char]47)) + '/cl.exe'
          "EDGE0_CUDA_HOST_CL=$clForCMake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "cl for CMake : $clForCMake"

          # Prove both sides now agree
          $fromPath = (Get-Command cl).Source
          Write-Host "cl from PATH : $fromPath"
          if ($fromPath -ne "$shortBin\cl.exe") { throw "PATH still resolves cl to $fromPath" }

          # Linker library search path: CMake links strata_kq.dll by calling
          # link.exe directly, and passes cudadevrt.lib / cudart_static.lib as
          # bare names. link.exe searches %LIB%, which msvc-dev-cmd filled with
          # only MSVC and Windows SDK paths, so it fails with
          #   LINK : fatal error LNK1181: cannot open input file 'cudadevrt.lib'
          # Add the CUDA lib directory to LIB (must happen AFTER msvc-dev-cmd,
          # which overwrites LIB wholesale).
          $cudaRoot = $env:CUDA_PATH
          if (-not $cudaRoot) { throw 'CUDA_PATH is not set' }
          $cudaLib = Join-Path $cudaRoot 'lib\x64'
          if (-not (Test-Path (Join-Path $cudaLib 'cudadevrt.lib'))) {
            Write-Host "cudadevrt.lib not at $cudaLib; listing lib dir:"
            Get-ChildItem (Join-Path $cudaRoot 'lib') -Recurse -Filter 'cudadevrt.lib' -ErrorAction SilentlyContinue |
              Select-Object -First 5 | ForEach-Object { Write-Host ("  " + $_.FullName) }
            throw "cudadevrt.lib not found under $cudaLib"
          }
          $env:LIB = $cudaLib + ';' + $env:LIB
          "LIB=$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "LIB now starts with: $cudaLib"
          Write-Host "cudadevrt.lib present: $(Test-Path (Join-Path $cudaLib 'cudadevrt.lib'))"
          Write-Host "cudart_static.lib present: $(Test-Path (Join-Path $cudaLib 'cudart_static.lib'))"

      - name: 淇ˉ package.ps1锛圕Make 3.31 鍚炲弽鏂滄潬闂锛?        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # History of this failure, straight from logs-x64/strata-configure.log:
          #   1) backslashes vanished: -ccbin=C:Program Files...cl.exe
          #      -> "nvcc fatal : Cannot find compiler ... in PATH"
          #      fixed by passing forward-slash paths to CMake.
          #   2) CMake then rewrote the host compiler to its 8.3 short name,
          #      so -ccbin said C:/PROGRA~1/MICROS~2/... while PATH held the long
          #      form, and nvcc compared the two strings:
          #      "cl.exe in PATH (...) is different than one specified with -ccbin"
          # Fix for (2): replace the long MSVC bin directory on PATH with the
          # same 8.3 form CMake uses, so both sides match exactly.
          $ps1 = 'scripts\package\windows\package.ps1'
          $text = Get-Content -Raw -LiteralPath $ps1
          $orig = $text

          # Forward-slash paths (fix 1, already proven to work)
          $text = $text.Replace(
            '$cl = (Get-Command cl).Source',
            '$cl = (Get-Command cl).Source.Replace( [char]92, [char]47 )')
          $text = $text.Replace(
            '$cc = (Get-Command clang-cl).Source',
            '$cc = (Get-Command clang-cl).Source.Replace( [char]92, [char]47 )')
          $text = $text.Replace(
            '-DCMAKE_CUDA_COMPILER=$((Get-Command nvcc).Source)',
            '-DCMAKE_CUDA_COMPILER=$((Get-Command nvcc).Source.Replace( [char]92, [char]47 ))')

          # Fix 2: hand CMake the SAME 8.3 short path that PATH now resolves to.
          # (The previous junction approach failed because nvcc compares strings:
          # a junction path never equals the real path on PATH.)
          $marker = 'Step "edge0-strata (CUDA $($C.CudaArchs))"'
          if (-not $text.Contains($marker)) { throw 'patch anchor "Step edge0-strata" not found' }
          $text = $text.Replace($marker,
            $marker + "`r`n    if (`$env:EDGE0_CUDA_HOST_CL) { `$cl = `$env:EDGE0_CUDA_HOST_CL; Write-Host `"strata: cl = `$cl`" }")

          # Fix 3: force CMake to accept the CUDA compiler without running its
          # trial link. In Modules/CMakeTestCUDACompiler.cmake the ONLY branch
          # that skips the test is:
          #     if(CMAKE_CUDA_COMPILER_FORCED) set(..._WORKS TRUE) return()
          # and a few lines below it does  unset(CMAKE_CUDA_COMPILER_WORKS CACHE)
          # which is why passing _WORKS does nothing at all.
          # The trial link fails on
          #     LNK2019: unresolved external symbol __cudaRegisterFatBinary
          # because that throwaway link line never gets cudart.lib.
          $anchor = "'-DSTRATA_ENABLE_CUDA=ON', '-DSTRATA_PORTABLE=ON',"
          if (-not $text.Contains($anchor)) { throw 'patch anchor for STRATA_ENABLE_CUDA not found' }
          $text = $text.Replace($anchor,
            "'-DSTRATA_ENABLE_CUDA=ON', '-DSTRATA_PORTABLE=ON', '-DCMAKE_CUDA_COMPILER_FORCED=1',")

          # Fix 4: drop --use-local-env so nvcc detects the environment itself
          # instead of trusting the inherited INCLUDE/LIB.
          if ($text.Contains('--use-local-env -D_WINDOWS')) {
            $text = $text.Replace('--use-local-env -D_WINDOWS', '-D_WINDOWS')
            Write-Host 'removed --use-local-env'
          } else {
            Write-Host 'note: --use-local-env not present (already patched)'
          }

          # Fix 5: scrub the build-machine paths that numpy's prebuilt wheel bakes
          # into numpy/__config__.py. check.py rejects any package file holding
          # $env:USERPROFILE, and numpy 2.5.3's wheel ships exactly that, so the
          # self-check fails through no fault of this project:
          #   build path in ...\numpy\__config__.py: /Users/runneradmin/, ...
          # __config__ only feeds numpy.show_config(); rewriting those strings
          # leaves every numeric routine untouched. A separate Python helper does
          # the edit, which avoids nested quoting inside this PowerShell patch.
          $scrubAnchor = "    Step 'check modules, PE machine and build paths'"
          if (-not $text.Contains($scrubAnchor)) { throw 'patch anchor for check step not found' }
          $scrubCall = '    & python "$PSScriptRoot\scrub_numpy_paths.py" $stage'
          $text = $text.Replace($scrubAnchor, $scrubCall + "`r`n" + $scrubAnchor)

          if ($text -eq $orig) { throw 'patch did not apply: package.ps1 layout changed' }

          # Write the scrub helper next to check.py, so $PSScriptRoot resolves it.
          # The Python source travels as base64 to keep YAML indentation and
          # quoting rules out of the picture entirely.
          $scrubB64 = ''
          $scrubPath = 'scripts\package\windows\scrub_numpy_paths.py'
          $scrubBytes = [Convert]::FromBase64String($scrubB64)
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) $scrubPath), $scrubBytes)
          Write-Host ("wrote {0} ({1} bytes)" -f $scrubPath, $scrubBytes.Length)

          [IO.File]::WriteAllText((Resolve-Path $ps1), $text, (New-Object Text.UTF8Encoding($false)))
          Write-Host 'patch applied. Patched lines:'
          Get-Content -LiteralPath $ps1 |
            Select-String -Pattern '\$cl = |\$cc = |-DCMAKE_CUDA_COMPILER=|\$cudaFlags = |strata: cl =' |
            ForEach-Object { Write-Host ('  ' + $_.Line.Trim()) }

      - name: 鎷夊彇渚濊禆
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File .\scripts\package\windows\package.ps1 fetch -Cache C:\edge0-cache -Commit $env:GITHUB_SHA

      - name: 缂栬瘧鎵撳寘
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File .\scripts\package\windows\package.ps1 build -Cache C:\edge0-cache -Out C:\edge0-out -Commit $env:GITHUB_SHA

      - name: 鏍￠獙鑷
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem 'C:\edge0-out\edge0-chat-*-windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'package zip not found' }
          powershell -ExecutionPolicy Bypass -File .\scripts\package\windows\package.ps1 verify -Zip $zip.FullName

      - name: 娓呯悊浜х墿涓殑澹版槑鍗忚鏂囦欢
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem 'C:\edge0-out\edge0-chat-*-windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'package zip not found' }
          $tmp = 'C:\edge0-clean'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          Expand-Archive -Path $zip.FullName -DestinationPath $tmp
          $patterns = @('LICENSE*','LICENCE*','NOTICE*','THIRD-PARTY*','OFL.txt','user-README*','COPYING*')
          $removed = 0
          Get-ChildItem -Path $tmp -Recurse -Force -File | Where-Object {
            $name = $_.Name
            $hit = $false
            foreach ($p in $patterns) { if ($name -like $p) { $hit = $true } }
            $hit -and ($name -notmatch '\.(exe|dll|pyd|json|py|js|ts)$')
          } | ForEach-Object {
            Write-Host ("Removing: " + $_.FullName.Substring($tmp.Length))
            Remove-Item -Force $_.FullName
            $removed++
          }
          Get-ChildItem -Path $tmp -Recurse -Force -Directory -Filter 'licenses' | ForEach-Object {
            Write-Host ("Removing dir: " + $_.FullName.Substring($tmp.Length))
            Remove-Item -Recurse -Force $_.FullName
            $removed++
          }
          Write-Host ("Removed {0} notice/license item(s)" -f $removed)
          Remove-Item -Force $zip.FullName
          Compress-Archive -Path "$tmp\*" -DestinationPath $zip.FullName -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLower()
          Set-Content -Path "$($zip.FullName).sha256" -Value "$hash  $($zip.Name)"

      - name: 涓婁紶鎵撳寘浜х墿
        uses: actions/upload-artifact@v4
        with:
          name: edge0-chat-zh-windows-x64
