# .github/workflows/build-zh.yml
# 简体中文定制版打包流程
#
# 在 windows-latest（微软官方 Windows 机器）上原生编译整个 Edge0：
#   Edge0 Chat.exe（Tauri 桌面应用）
#   edge0-infer.exe（推理引擎，MSVC + Vulkan）
#   edge0-strata\（strata.exe + Python 运行时 + serve 网页）
# 产出 edge0-chat-<version>-windows-x64.zip，布局与官方发布一致，全部中文界面。
#
# 依据：官方打包脚本 scripts/package/windows/package.ps1 的三个阶段
#   fetch（联网拉依赖）→ build（离线编译打包）→ verify（自检）
# 本 workflow 复用该脚本，只额外装它需要的 CUDA Toolkit 和 Vulkan SDK。
#
# 注意：所有 run: | 脚本块一律纯 ASCII（英文），避免 Windows PowerShell 5.1
# 在读取含中文的脚本时出现编码/解析错误；中文只出现在 name: 步骤标题。

name: 构建中文版 Edge0 Chat

'on':
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 原生编译打包
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Rust（MSVC 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 LLVM（clang-cl / lld-link）
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          winget install --id LLVM.LLVM --silent --accept-package-agreements --accept-source-agreements
          $llvm = 'C:\Program Files\LLVM\bin'
          if (Test-Path $llvm) { $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          Write-Host "LLVM installed"

      - name: 安装 Vulkan SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://sdk.lunarg.com/sdk/download/1.4.363.1/windows/vulkansdk-windows-X64-1.4.363.1.exe'
          $installer = "$env:TEMP\vulkan-sdk.exe"
          Write-Host "Downloading Vulkan SDK..."
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait -NoNewWindow
          $sdkRoot = 'C:\VulkanSDK\1.4.363.1'
          if (-not (Test-Path $sdkRoot)) {
            $sdkRoot = (Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          }
          Write-Host "VULKAN_SDK=$sdkRoot"
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkRoot\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装 CUDA Toolkit 13
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://developer.download.nvidia.com/compute/cuda/13.0.0/network_installers/cuda_13.0.0_windows_network.exe'
          $installer = "$env:TEMP\cuda-installer.exe"
          Write-Host "Downloading CUDA network installer..."
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Write-Host "Installing CUDA..."
          # cmd /c with start /wait blocks until the bootstrapper's children exit;
          # Start-Process -Wait returns early because the network installer hands off.
          $args8 = '-s nvcc_13.0 cudart_13.0 cudart_dev_13.0 visual_studio_integration_13.0 nvrtc_13.0 nvrtc_dev_13.0 cublas_13.0 cublas_dev_13.0'
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList "/c `"`"$installer`" $args8`"" -Wait -PassThru -NoNewWindow
          Write-Host "CUDA installer exit code: $($p.ExitCode)"
          # Wait for the toolkit directory to appear (up to 10 minutes).
          $cudaBase = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA'
          $waited = 0
          while (-not (Test-Path $cudaBase) -and $waited -lt 600) {
            Start-Sleep -Seconds 15
            $waited += 15
            Write-Host "  waiting for $cudaBase ($waited s)"
          }
          if (-not (Test-Path $cudaBase)) { throw "CUDA toolkit directory never appeared after $waited s" }
          $cudaRoot = Get-ChildItem $cudaBase -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $cudaRoot) { throw "no CUDA version directory under $cudaBase" }
          $cudaRoot = $cudaRoot.FullName
          Write-Host "CUDA root: $cudaRoot"
          # Verify dev headers exist (last run failed on missing crt/host_config.h)
          $hostConfig = Join-Path $cudaRoot 'include\crt\host_config.h'
          if (-not (Test-Path $hostConfig)) {
            Write-Host "ERROR: missing $hostConfig"
            Write-Host "Listing include dir:"
            Get-ChildItem (Join-Path $cudaRoot 'include') -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Host ("  " + $_.Name) }
            throw "CUDA dev headers incomplete: crt/host_config.h not found"
          }
          Write-Host "CUDA dev headers OK: $hostConfig"
          Write-Host "CUDA_PATH=$cudaRoot"
          "CUDA_PATH=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cudaRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 加载 MSVC 开发环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 构建前检查工具链
        shell: powershell
        run: |
          $tools = @{
            'cl.exe'        = 'MSVC C++ compiler'
            'clang-cl.exe'  = 'LLVM compiler'
            'lld-link.exe'  = 'LLVM linker'
            'nvcc.exe'      = 'CUDA compiler'
            'glslc.exe'     = 'Vulkan shader compiler'
            'cmake.exe'     = 'CMake'
            'ninja.exe'     = 'Ninja'
            'node.exe'      = 'Node.js'
            'npm.cmd'       = 'npm'
            'cargo.exe'     = 'Rust Cargo'
            'python.exe'    = 'Python'
            'curl.exe'      = 'curl'
            'tar.exe'       = 'tar'
            'git.exe'       = 'Git'
            'link.exe'      = 'MSVC linker'
          }
          $missing = @()
          foreach ($t in ($tools.Keys | Sort-Object)) {
            $found = Get-Command $t -ErrorAction SilentlyContinue
            if ($found) {
              Write-Host ("  OK   {0,-14} {1}" -f $t, $found.Source)
            } else {
              Write-Host ("  MISS {0,-14} {1}" -f $t, $tools[$t])
              $missing += $t
            }
          }
          Write-Host ""
          foreach ($v in @('INCLUDE','LIB','VCToolsRedistDir','CUDA_PATH','VULKAN_SDK')) {
            $val = [Environment]::GetEnvironmentVariable($v)
            if ($val) {
              Write-Host ("  OK   {0,-18} {1}" -f $v, $val)
            } else {
              Write-Host ("  MISS {0,-18} not set" -f $v)
              $missing += "env:$v"
            }
          }
          Write-Host ""
          if ($missing.Count -gt 0) {
            Write-Host ("WARNING: {0} item(s) not ready; package.ps1 check-machine decides" -f $missing.Count)
            Write-Host ("Missing: {0}" -f ($missing -join ', '))
          } else {
            Write-Host "All tools present."
          }

      - name: 拉取依赖
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File .\scripts\package\windows\package.ps1 fetch -Cache C:\edge0-cache -Commit $env:GITHUB_SHA

      - name: 编译打包
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File .\scripts\package\windows\package.ps1 build -Cache C:\edge0-cache -Out C:\edge0-out -Commit $env:GITHUB_SHA

      - name: 校验自检
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem 'C:\edge0-out\edge0-chat-*-windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'package zip not found' }
          powershell -ExecutionPolicy Bypass -File .\scripts\package\windows\package.ps1 verify -Zip $zip.FullName

      - name: 清理产物中的声明协议文件
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem 'C:\edge0-out\edge0-chat-*-windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'package zip not found' }
          $tmp = 'C:\edge0-clean'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          Expand-Archive -Path $zip.FullName -DestinationPath $tmp
          $patterns = @('LICENSE*','LICENCE*','NOTICE*','THIRD-PARTY*','OFL.txt','user-README*','COPYING*')
          $removed = 0
          Get-ChildItem -Path $tmp -Recurse -Force -File | Where-Object {
            $name = $_.Name
            $hit = $false
            foreach ($p in $patterns) { if ($name -like $p) { $hit = $true } }
            $hit -and ($name -notmatch '\.(exe|dll|pyd|json|py|js|ts)$')
          } | ForEach-Object {
            Write-Host ("Removing: " + $_.FullName.Substring($tmp.Length))
            Remove-Item -Force $_.FullName
            $removed++
          }
          Get-ChildItem -Path $tmp -Recurse -Force -Directory -Filter 'licenses' | ForEach-Object {
            Write-Host ("Removing dir: " + $_.FullName.Substring($tmp.Length))
            Remove-Item -Recurse -Force $_.FullName
            $removed++
          }
          Write-Host ("Removed {0} notice/license item(s)" -f $removed)
          Remove-Item -Force $zip.FullName
          Compress-Archive -Path "$tmp\*" -DestinationPath $zip.FullName -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLower()
          Set-Content -Path "$($zip.FullName).sha256" -Value "$hash  $($zip.Name)"

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: edge0-chat-zh-windows-x64
          path: |
            C:\edge0-out\edge0-chat-*-windows-x64.zip
            C:\edge0-out\edge0-chat-*-windows-x64.zip.sha256
          retention-days: 14

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: C:\edge0-out\logs-*
          retention-days: 7
